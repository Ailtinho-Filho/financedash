<style>
:root{
  --ink:#12241D; --ink-2:#31463D; --ink-3:#6E837A;
  --paper:#F2F0E9; --paper-2:#FBFAF6;
  --line:#DCD8CB; --line-2:#C6C1B0;
  --pine:#1F5741; --pine-soft:#E2EDE6;
  --gold:#C08A1E; --gold-soft:#F8EED6;
  --rust:#A93A1C; --rust-soft:#F8E4DC;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Familjen Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#app{max-width:520px;margin:0 auto;padding:0 18px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);min-height:100%}
header{padding:calc(env(safe-area-inset-top) + 22px) 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.01em}
.month-pick{display:flex;align-items:center;gap:2px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.month-pick button{background:none;border:0;width:28px;height:28px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1}
.month-pick button:active{background:var(--line)}
.month-pick span{font-size:13px;font-weight:600;padding:0 4px;min-width:66px;text-align:center;text-transform:capitalize}
