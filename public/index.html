<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceDash</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.pluggy.ai/pluggy-connect/latest/pluggy-connect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="dashboard">
    <header>
      <div>
        <h1>FinanceDash</h1>
        <p class="subtitle">Leitura de extratos em PDF ou conexão direta via Open Finance</p>
      </div>
      <div class="header-actions">
        <span class="badge">Processamento local</span>
        <button class="link-btn" id="logout-btn">Sair</button>
      </div>
    </header>

    <section class="import-card">
      <h2>Conectar banco</h2>
      <p>Conecte sua conta via Open Finance para importar transações automaticamente.</p>
      <button class="connect-btn" id="connect-btn">Conectar banco (Open Finance)</button>
      <p class="error" id="connect-error" hidden></p>
    </section>

    <section class="accounts-section" id="accounts-section" hidden>
      <h2>Contas conectadas</h2>
      <div id="items-list"></div>
    </section>

    <section class="spending-section" id="spending-section" hidden>
      <div class="spending-header">
        <div>
          <h2>Gastos por categoria</h2>
          <p class="subtitle" id="spending-period"></p>
        </div>
        <div class="period-filter">
          <select id="month-select"></select>
          <select id="year-select"></select>
        </div>
      </div>
      <div class="spending-grid">
        <div class="chart-card">
          <canvas id="spending-chart"></canvas>
        </div>
        <div class="category-list" id="category-list"></div>
      </div>
    </section>

    <section class="transactions-section" id="transactions-section" hidden>
      <h2>Últimas transações</h2>
      <div id="transactions-list"></div>
    </section>
  </div>

  <script src="/api.js"></script>
  <script>
    if (!localStorage.getItem("token")) window.location.href = "/login.html";

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    });

    // --- Pluggy Connect ---
    const connectBtn = document.getElementById("connect-btn");
    const connectError = document.getElementById("connect-error");
    connectBtn.addEventListener("click", async () => {
      connectError.hidden = true;
      connectBtn.disabled = true;
      connectBtn.textContent = "Abrindo...";
      try {
        const { accessToken } = await api.getConnectToken();
        const pluggyConnect = new window.PluggyConnect({
          connectToken: accessToken,
          includeSandbox: true,
          onSuccess: async (itemData) => {
            try {
              await api.linkItem(itemData.item.id);
              await refreshItems();
            } catch (err) { showConnectError(err.message); }
          },
          onError: (err) => showConnectError(err?.message || "Erro ao conectar banco."),
        });
        pluggyConnect.init();
      } catch (err) {
        showConnectError(err.message);
      } finally {
        connectBtn.disabled = false;
        connectBtn.textContent = "Conectar banco (Open Finance)";
      }
    });
    function showConnectError(msg) {
      connectError.textContent = msg;
      connectError.hidden = false;
    }

    // --- Lista de itens/contas conectadas ---
    const accountsSection = document.getElementById("accounts-section");
    const itemsList = document.getElementById("items-list");

    // Guarda todas as contas encontradas, pra puxar transações de cada uma depois.
    let allAccounts = [];

    async function refreshItems() {
      const { itemIds } = await api.listItems();

      if (itemIds.length === 0) {
        accountsSection.hidden = true;
        hideSpendingAndTransactions();
        return;
      }

      accountsSection.hidden = false;
      itemsList.innerHTML = "";
      allAccounts = [];

      for (const itemId of itemIds) {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-header">
            <span>Item ${itemId.slice(0, 8)}...</span>
            <button class="link-btn" data-item-id="${itemId}">Desconectar</button>
          </div>
          <ul id="accounts-${itemId}"></ul>
        `;
        itemsList.appendChild(card);

        card.querySelector("button").addEventListener("click", async () => {
          await api.removeItem(itemId);
          await refreshItems();
        });

        try {
          const { accounts } = await api.listAccounts(itemId);
          const ul = card.querySelector(`#accounts-${itemId}`);
          ul.innerHTML = accounts
            .map((acc) => `<li>${acc.name} — ${acc.currencyCode} ${acc.balance}</li>`)
            .join("");
          allAccounts.push(...accounts);
        } catch {
          // item pode estar em UPDATING — poderia fazer polling aqui
        }
      }

      if (allAccounts.length > 0) {
        await loadSpendingAndTransactions();
      } else {
        hideSpendingAndTransactions();
      }
    }

    // --- Gastos por categoria + últimas transações ---
    const spendingSection = document.getElementById("spending-section");
    const spendingPeriod = document.getElementById("spending-period");
    const categoryListEl = document.getElementById("category-list");
    const transactionsSection = document.getElementById("transactions-section");
    const transactionsListEl = document.getElementById("transactions-list");
    const monthSelect = document.getElementById("month-select");
    const yearSelect = document.getElementById("year-select");

    let chartInstance = null;
    let rawTransactions = []; // todas as transações buscadas (últimos 12 meses), sem filtro

    function hideSpendingAndTransactions() {
      spendingSection.hidden = true;
      transactionsSection.hidden = true;
    }

    const CATEGORY_COLORS = [
      "#3ddc97", "#ff5fa2", "#5aa9ff", "#ffb347", "#c792ea",
      "#ff6b6b", "#4dd0e1", "#f4d35e", "#a8e6a1", "#b0bec5",
    ];

    const MONTH_NAMES = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro",
    ];

    function populateFilters() {
      const now = new Date();
      monthSelect.innerHTML = MONTH_NAMES.map((m, i) => `<option value="${i}">${m}</option>`).join("");
      monthSelect.value = now.getMonth();

      const years = [now.getFullYear() - 1, now.getFullYear()];
      yearSelect.innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join("");
      yearSelect.value = now.getFullYear();
    }

    monthSelect.addEventListener("change", applyPeriodFilter);
    yearSelect.addEventListener("change", applyPeriodFilter);

    async function loadSpendingAndTransactions() {
      // Busca uma janela ampla (últimos 12 meses) uma única vez; o filtro de mês/ano é aplicado no cliente.
      const to = new Date();
      const from = new Date();
      from.setFullYear(from.getFullYear() - 1);
      const params = { dateFrom: from.toISOString().slice(0, 10), dateTo: to.toISOString().slice(0, 10) };

      rawTransactions = [];
      let hadError = false;
      for (const acc of allAccounts) {
        try {
          const data = await api.listTransactions(acc.id, params);
          rawTransactions.push(...(data.results || []));
        } catch (err) {
          hadError = true;
          console.error("Falha ao buscar transações da conta", acc.id, err);
        }
      }

      populateFilters();
      applyPeriodFilter(hadError);
    }

    function applyPeriodFilter(hadErrorOverride) {
      const month = Number(monthSelect.value);
      const year = Number(yearSelect.value);

      const filtered = rawTransactions.filter((t) => {
        const d = new Date(t.date);
        return d.getMonth() === month && d.getFullYear() === year;
      });

      spendingPeriod.textContent = `${MONTH_NAMES[month]} de ${year}`;

      if (filtered.length === 0) {
        spendingSection.hidden = true;
        transactionsSection.hidden = false;
        transactionsListEl.innerHTML = `<p class="empty-state">${
          hadErrorOverride === true
            ? "Não foi possível carregar as transações agora. Tente recarregar a página."
            : `Nenhuma transação encontrada em ${MONTH_NAMES[month]} de ${year}.`
        }</p>`;
        return;
      }

      renderSpendingChart(filtered);
      renderTransactionsList(filtered);
      spendingSection.hidden = false;
      transactionsSection.hidden = false;
    }

    function renderSpendingChart(transactions) {
      // Só gastos (valores negativos) agrupados por categoria.
      const expenses = transactions.filter((t) => t.amount < 0);
      const totals = {};
      for (const t of expenses) {
        const cat = t.category || "Sem categoria";
        totals[cat] = (totals[cat] || 0) + Math.abs(t.amount);
      }

      const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const labels = entries.map(([cat]) => cat);
      const values = entries.map(([, val]) => val);
      const total = values.reduce((sum, v) => sum + v, 0);

      const ctx = document.getElementById("spending-chart");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: labels.map((_, i) => CATEGORY_COLORS[i % CATEGORY_COLORS.length]),
            borderWidth: 0,
          }],
        },
        options: {
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.raw)}`,
              },
            },
          },
          cutout: "65%",
        },
      });

      categoryListEl.innerHTML = entries
        .map(([cat, val], i) => {
          const pct = total > 0 ? ((val / total) * 100).toFixed(0) : 0;
          const color = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
          return `
            <div class="category-row">
              <span class="category-dot" style="background:${color}"></span>
              <span class="category-name">${cat}</span>
              <span class="category-pct">${pct}%</span>
              <span class="category-value">${formatCurrency(val)}</span>
            </div>
          `;
        })
        .join("");
    }

    function renderTransactionsList(transactions) {
      const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 15);
      transactionsListEl.innerHTML = sorted
        .map((t) => {
          const isExpense = t.amount < 0;
          return `
            <div class="transaction-row">
              <div class="transaction-info">
                <span class="transaction-desc">${t.description || "Sem descrição"}</span>
                <span class="transaction-meta">${formatDate(new Date(t.date))} · ${t.category || "Sem categoria"}</span>
              </div>
              <span class="transaction-amount ${isExpense ? "expense" : "income"}">
                ${isExpense ? "-" : "+"}${formatCurrency(Math.abs(t.amount))}
              </span>
            </div>
          `;
        })
        .join("");
    }

    function formatCurrency(value) {
      return value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function formatDate(date) {
      return date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    }

    refreshItems();
  </script>
</body>
</html>
